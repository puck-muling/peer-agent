[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "peer-agent"
version = "0.1.0"
description = "Decentralized multi-agent code review mesh connecting Claude Code, OpenAI Codex, and Google Antigravity."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "PeerAgent Contributors" }
]
keywords = [
    "multi-agent",
    "code-review",
    "claude-code",
    "codex",
    "antigravity",
    "peer-review",
    "developer-tools"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Bug Tracking",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/puck-muling/peer-agent"
Documentation = "https://github.com/puck-muling/peer-agent#readme"
Repository = "https://github.com/puck-muling/peer-agent.git"
Issues = "https://github.com/puck-muling/peer-agent/issues"

[tool.setuptools]
packages = []
script-files = ["bin/peer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "peer-agent"
version = "0.1.6"
description = "让 Claude 与 Codex 帮彼此审代码 —— 订阅原生的对等多智能体交叉审阅 CLI (Connecting Claude, Codex, and Antigravity)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "PeerAgent Contributors" }
]
keywords = [
    "multi-agent",
    "code-review",
    "claude",
    "codex",
    "antigravity",
    "peer-review",
    "developer-tools"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Bug Tracking",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/puck-muling/peer-agent"
Documentation = "https://github.com/puck-muling/peer-agent#readme"
Repository = "https://github.com/puck-muling/peer-agent.git"
Issues = "https://github.com/puck-muling/peer-agent/issues"

[tool.setuptools]
packages = []
script-files = ["bin/peer"]

[tool.setuptools.data-files]
"templates" = [
    "templates/review.md",
    "templates/plan.md",
    "templates/advice.md",
    "templates/exec.md",
    "templates/image.md",
]
"skills/antigravity/claude" = ["skills/antigravity/claude/SKILL.md"]
"skills/antigravity/codex" = ["skills/antigravity/codex/SKILL.md"]
"skills/claude/codex" = ["skills/claude/codex/SKILL.md"]
"skills/codex/claude" = ["skills/codex/claude/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

<title id="title">三端发起，两端执行</title><desc id="desc">Antigravity、Claude、Codex 是三个发起端，经 peer 调用 Claude 或 Codex 两种无头执行端。Antigravity 不作为执行端。只读和可写权限分别标注，结果由文件协议回收。</desc>

<text x="101" y="430" font-size="35" font-weight="700" fill="#3dd6c6">peer</text>
<text x="211" y="428" font-size="27" font-weight="600" fill="#e6edf3">单文件 Python CLI</text>
<text x="101" y="469" font-size="23" font-weight="400" fill="#e6edf3">纯 Python 标准库  /  无常驻后台守护进程  /  文件协议调度</text>
<text x="101" y="500" font-size="19" font-weight="400" fill="#9eacbb">peer ask → 临时 _run → peer wait     ·     STOP 停机锁 + PEER_DEPTH 调用门禁</text>
<path d="M 425 518 L 425 595" fill="none" stroke="#b9a0ff" stroke-width="2" opacity="1"/><polygon points="425,595 420.5,585 429.5,585" fill="#b9a0ff"/>
<path d="M 1175 518 L 1175 595" fill="none" stroke="#b9a0ff" stroke-width="2" opacity="1"/><polygon points="1175,595 1170.5,585 1179.5,585" fill="#b9a0ff"/>
<text x="70" y="564" font-size="15" font-weight="600" fill="#b9a0ff" letter-spacing="1">PROVIDERS / 无头执行端（仅两种）</text>
<text x="820" y="564" font-size="18" font-weight="400" fill="#9eacbb">read / write 按任务类型选择</text>
<rect x="70" y="595" width="710" height="190" rx="16" fill="#161b22" stroke="#b9a0ff" stroke-width="1.5"/>
<text x="96" y="633" font-size="27" font-weight="600" fill="#e6edf3">Claude</text>
<text x="96" y="670" font-size="23" font-weight="400" fill="#3dd6c6">只读：移除 Edit / Write；Bash 沙箱禁网</text>
<text x="96" y="701" font-size="20" font-weight="400" fill="#9eacbb">WebSearch / WebFetch 仍可用</text>
<text x="96" y="739" font-size="21" font-weight="400" fill="#b9a0ff">可写 exec：acceptEdits + 调用前快照 / 调用后 Diff</text>
<text x="96" y="769" font-size="18" font-weight="400" fill="#9eacbb">后台 -p · stream-json · 不持久化会话</text>
<rect x="820" y="595" width="710" height="190" rx="16" fill="#161b22" stroke="#b9a0ff" stroke-width="1.5"/>
<text x="846" y="633" font-size="27" font-weight="600" fill="#e6edf3">Codex</text>
<text x="846" y="670" font-size="23" font-weight="400" fill="#3dd6c6">只读：--sandbox read-only</text>
<text x="846" y="704" font-size="22" font-weight="400" fill="#b9a0ff">可写 exec：--sandbox workspace-write</text>
<text x="846" y="739" font-size="21" font-weight="400" fill="#b9a0ff">调用前快照 / 调用后 Diff</text>
<text x="846" y="769" font-size="18" font-weight="400" fill="#9eacbb">后台 exec · --json · --ephemeral</text>
<text x="70" y="825" font-size="20" font-weight="400" fill="#9eacbb">回收：response.md → peer wait → 发起端；仅可写模式附 changes.md / changes.diff（受快照与 Diff 上限约束）。</text>
<text x="64" y="873" font-size="14" font-weight="400" fill="#9eacbb">代码依据：bin/peer · AGENT_NAMES / KINDS · build_args · cmd_ask / cmd_run / cmd_wait</text>
<text x="1536" y="873" font-size="14" font-weight="600" fill="#3dd6c6" text-anchor="end" letter-spacing="1">PEER / CODE-VERIFIED</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">一次请求，如何完成独立审阅</title><desc id="desc">四泳道时序图。请求先落盘，通过 STOP 与调用深度门禁后先保存元数据，再启动临时后台 runner 与无头 CLI。runner 捕获标准输出与错误；wait 仅轮询并读取结果。子进程递归调用在深度门禁退出，代码为 2。</desc>
<metadata>PeerAgent | Mermaid companion SHA-256: 75ef4179416e5c41abed4340bcf27122f23349eb48f474722794fecba7f16fd5 | Layout: hand-authored 16:9 vector</metadata>
<defs>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 H 0 V 40" fill="none" stroke="#27313d" stroke-width="0.5" opacity="0.32"/></pattern>
 <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#58a6ff"/></marker><marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#3dd6c6"/></marker><marker id="arrow-purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#b9a0ff"/></marker><marker id="arrow-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#ff7b86"/></marker><marker id="arrow-muted" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#9eacbb"/></marker>
</defs>
<rect width="1600" height="900" fill="#0d1117"/><rect width="1600" height="900" fill="url(#grid)"/>
<g font-family="sans-serif" fill="#e6edf3">
<text x="64" y="55" font-size="16" font-weight="600" fill="#3dd6c6" letter-spacing="2">PEERAGENT  /  02  /  REVIEW LIFECYCLE</text>
<text x="64" y="111" font-size="39" font-weight="700" fill="#e6edf3">一次请求，如何完成独立审阅</text>
<text x="64" y="150" font-size="20" font-weight="400" fill="#9eacbb">纵向时间向下 · 普通 review 只读 · 可写 exec 的快照与 Diff 单独标明</text>
<path d="M 64 174 L 1536 174" fill="none" stroke="#9eacbb" stroke-width="2" opacity="0.25"/>
<rect x="45" y="192" width="280" height="47" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
<text x="185" y="223" font-size="20" font-weight="600" fill="#e6edf3" text-anchor="middle">发起端 Consumer</text>
<path d="M 185 240 L 185 813" fill="none" stroke="#9eacbb" stroke-width="2" opacity="0.32" stroke-dasharray="6 6"/>
<rect x="420" y="192" width="280" height="47" rx="10" fill="#161b22" stroke="#3dd6c6" stroke-width="1.5"/>
<text x="560" y="223" font-size="20" font-weight="600" fill="#e6edf3" text-anchor="middle">peer ask / 临时 _run</text>
<path d="M 560 240 L 560 813" fill="none" stroke="#9eacbb" stroke-width="2" opacity="0.32" stroke-dasharray="6 6"/>
<rect x="840" y="192" width="280" height="47" rx="10" fill="#161b22" stroke="#b9a0ff" stroke-width="1.5"/>
<text x="980" y="223" font-size="20" font-weight="600" fill="#e6edf3" text-anchor="middle">无头 Claude / Codex</text>
<path d="M 980 240 L 980 813" fill="none" stroke="#9eacbb" stroke-width="2" opacity="0.32" stroke-dasharray="6 6"/>
<rect x="1265" y="192" width="280" height="47" rx="10" fill="#161b22" stroke="#526273" stroke-width="1.5"/>
<text x="1405" y="223" font-size="20" font-weight="600" fill="#e6edf3" text-anchor="middle">工作区文件协议</text>
<path d="M 1405 240 L 1405 813" fill="none" stroke="#9eacbb" stroke-width="2" opacity="0.32" stroke-dasharray="6 6"/>
<path d="M 185 276 L 1405 276" fill="none" stroke="#58a6ff" stroke-width="2" opacity="1"/><polygon points="1405,276 1395,280.5 1395,271.5" fill="#58a6ff"/>
<text x="205" y="266" font-size="19" font-weight="400" fill="#58a6ff">01  任务说明落盘：原始需求与证据置顶</text>
<path d="M 185 326 L 560 326" fill="none" stroke="#58a6ff" stroke-width="2" opacity="1"/><polygon points="560,326 550,330.5 550,321.5" fill="#58a6ff"/>
<text x="201" y="316" font-size="18" font-weight="400" fill="#58a6ff">02  peer ask → 安全门禁</text>
<text x="598" y="316" font-size="19" font-weight="400" fill="#9eacbb">STOP / STOP-agent → PEER_DEPTH；校验请求、类型及登录方式</text>
<text x="598" y="342" font-size="18" font-weight="400" fill="#9eacbb">STOP 命中：退出 3；深度命中：退出 2；可写必须 --quote</text>
<path d="M 560 384 L 1405 384" fill="none" stroke="#3dd6c6" stroke-width="2" opacity="1"/><polygon points="1405,384 1395,388.5 1395,379.5" fill="#3dd6c6"/>
<text x="576" y="374" font-size="18" font-weight="400" fill="#3dd6c6">03  保存 request.md；可写先快照；写 meta.json / status.json（queued）</text>
<path d="M 560 435 L 980 435" fill="none" stroke="#b9a0ff" stroke-width="2" opacity="1"/><polygon points="980,435 970,439.5 970,430.5" fill="#b9a0ff"/>
<text x="585" y="425" font-size="17" font-weight="400" fill="#b9a0ff">04  _run 读取 meta → 复查 STOP → 启动 CLI</text>
<text x="1030" y="430" font-size="18" font-weight="400" fill="#9eacbb">child_env：PEER_DEPTH=1（通常）</text>
<path d="M 185 480 L 560 480" fill="none" stroke="#58a6ff" stroke-width="2" opacity="1"/><polygon points="560,480 550,484.5 550,475.5" fill="#58a6ff"/>
<text x="201" y="470" font-size="18" font-weight="400" fill="#58a6ff">05  peer wait 轮询状态</text>
<text x="598" y="470" font-size="18" font-weight="400" fill="#9eacbb">ask 返回 run_id 后等待；启动与返回异步</text>
<rect x="455" y="497" width="635" height="115" rx="12" fill="#2a171f" stroke="#ff7b86" stroke-width="1.5"/>
<text x="474" y="521" font-size="18" font-weight="600" fill="#ff7b86">可选分支 / 子进程尝试再次 peer ask</text>
<path d="M 980 551 L 560 551" fill="none" stroke="#ff7b86" stroke-width="2" opacity="1"/><polygon points="560,551 570,546.5 570,555.5" fill="#ff7b86"/>
<text x="583" y="541" font-size="17" font-weight="400" fill="#ff7b86">继承 PEER_DEPTH ≥ 1 → is_nested_depth 命中</text>
<path d="M 560 590 L 980 590" fill="none" stroke="#ff7b86" stroke-width="2" opacity="1"/><polygon points="980,590 970,594.5 970,585.5" fill="#ff7b86"/>
<text x="583" y="580" font-size="17" font-weight="400" fill="#ff7b86">Exit Code 2：阻断本次嵌套调用，不启动下一层</text>
<path d="M 980 650 L 560 650" fill="none" stroke="#b9a0ff" stroke-width="2" opacity="1"/><polygon points="560,650 570,645.5 570,654.5" fill="#b9a0ff"/>
<text x="584" y="640" font-size="18" font-weight="400" fill="#b9a0ff">06  Stdio → _run 的 pump 线程</text>
<path d="M 560 697 L 1405 697" fill="none" stroke="#3dd6c6" stroke-width="2" opacity="1"/><polygon points="1405,697 1395,701.5 1395,692.5" fill="#3dd6c6"/>
<text x="576" y="687" font-size="18" font-weight="400" fill="#3dd6c6">07  stdout.log / stderr.log；解析结果；可写 compare → changes.md / changes.diff</text>
<path d="M 560 746 L 1405 746" fill="none" stroke="#3dd6c6" stroke-width="2" opacity="1"/><polygon points="1405,746 1395,750.5 1395,741.5" fill="#3dd6c6"/>
<text x="576" y="736" font-size="18" font-weight="400" fill="#3dd6c6">08  写 response.md + 最终 status.json（致命鉴权错误可触发 STOP-agent）</text>
<path d="M 1405 796 L 185 796" fill="none" stroke="#58a6ff" stroke-width="2" opacity="1"/><polygon points="185,796 195,791.5 195,800.5" fill="#58a6ff"/>
<text x="205" y="786" font-size="19" font-weight="400" fill="#58a6ff">09  peer wait 读取报告并打印；可写任务另显示 Diff 路径</text>
<text x="70" y="839" font-size="19" font-weight="400" fill="#e3b365">wait 超时（退出 10）或 unknown（退出 11）时，不自动重发 ask；本图展示正常主线及核心阻断分支。</text>
<text x="64" y="873" font-size="14" font-weight="400" fill="#9eacbb">代码依据：bin/peer · cmd_ask:1022 · cmd_run:1369 · pump:1358 · cmd_wait:1657</text>
<text x="1536" y="873" font-size="14" font-weight="600" fill="#3dd6c6" text-anchor="end" letter-spacing="1">PEER / CODE-VERIFIED</text>
</g></svg>

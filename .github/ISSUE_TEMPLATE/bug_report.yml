name: "🐛 Bug Report"
description: File a bug report to help improve PeerAgent
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please ensure that you have run `peer doctor` before submitting.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Run 'peer ask codex review --request ... --cwd ...'
        2. Wait for execution
        3. See error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment & peer doctor Output
      description: Paste the output of `peer doctor` and your OS details.
      render: shell
      placeholder: |
        OS: macOS 14.5 / Ubuntu 22.04
        Python: 3.11.8
        Output of peer doctor:
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output or Screenshots
      description: Please sanitize any personal email or secret tokens before posting!
      render: shell
    validations:
      required: false

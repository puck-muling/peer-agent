name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax and compilation check
        run: |
          python -m py_compile bin/peer
          python -m py_compile tests/test_peer.py
          bash -n install.sh

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

      - name: CLI smoke test
        run: |
          ./bin/peer --help
          ./bin/peer stats

      - name: Package build validation
        run: |
          pip install --no-build-isolation --dry-run .

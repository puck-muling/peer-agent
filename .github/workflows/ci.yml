name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax and compilation check
        run: |
          python -m py_compile bin/peer
          python -m py_compile tests/test_peer.py
          bash -n install.sh

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

      - name: CLI smoke test
        run: |
          ./bin/peer --help
          ./bin/peer stats

      - name: Installer smoke test (clean HOME)
        run: |
          export HOME="$(mktemp -d)"
          # 干净环境没有官方 CLI，peer doctor 预期返回 2；其他非零退出码视为失败
          rc=0
          bash install.sh --copy || rc=$?
          if [ "$rc" != "0" ] && [ "$rc" != "2" ]; then
            echo "install.sh exited with unexpected code $rc"; exit 1
          fi
          for f in .local/bin/peer .peer-review/bin/peer .peer-review/config.json \
                   .claude/skills/codex/SKILL.md .gemini/config/skills/codex/SKILL.md \
                   .gemini/config/skills/claude/SKILL.md .codex/skills/claude/SKILL.md \
                   .agents/skills/claude/SKILL.md; do
            test -f "$HOME/$f" || { echo "missing $HOME/$f"; exit 1; }
          done
          "$HOME/.local/bin/peer" --help >/dev/null
          bash install.sh --uninstall
          for f in .local/bin/peer .codex/skills/claude/SKILL.md .agents/skills/claude/SKILL.md; do
            test ! -e "$HOME/$f" || { echo "not removed $HOME/$f"; exit 1; }
          done

      - name: Package build validation
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install --no-build-isolation --dry-run .
